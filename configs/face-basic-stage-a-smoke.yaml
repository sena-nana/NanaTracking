data:
  dataset: multiview_smoke
  usage_tier: synthetic-smoke
  samples: 8
  batch_size: 2
  executor: inline
  workers: 0
  buffersize: 2
  require_complete_basic: false
model:
  name: face_basic
  input_channels: 3
  input_height: 64
  input_width: 64
  hidden_dims: 16
  rig_dims: 36
  pose_dims: 7
  landmark_count: 16
  identity_classes: 2
  identity_dims: 8
  dropout: 0.0
training:
  stage: real-geometry-pretrain
  seed: 17
  max_steps: 4
  learning_rate: 0.001
  minimum_learning_rate: 0.00001
  warmup_steps: 0
  weight_decay: 0.0001
  optimizer: adamw
  gradient_accumulation_steps: 2
  device: cpu
  amp: false
  shuffle: true
  deterministic: true
  validation_interval_steps: 2
  checkpoint_interval_steps: 2
  rig_loss_weight: 0.0
  pose_loss_weight: 0.0
  landmark_loss_weight: 1.0
  visibility_loss_weight: 0.25
  confidence_loss_weight: 0.0
  identity_adversary_weight: 0.1
  mirror_consistency_weight: 0.0
  canonical_geometry_loss_weight: 1.0
  pose_rotation_loss_weight: 1.0
  pose_translation_loss_weight: 1.0
  reprojection_loss_weight: 1.0
  multiview_geometry_loss_weight: 0.5
  multiview_pose_loss_weight: 0.5
evaluation:
  atol: 0.00001
  rtol: 0.0001
export:
  opset: 18
  model_family: nana-face-basic-stage-a-smoke
  model_version: 0.0.0-smoke
  smoke_only: true
  enabled: false
reproducibility:
  output_dir: runs/face-basic-stage-a-smoke
  data_revision: synthetic-stage-a-multiview-v1
  ntp_schema_revision: ntp/1.0
  signal_registry_revision: ntp-signals/1.0.0
  normalization_revision: ntp-normalization/1.0.0
  calibration_revision: ntp-calibration/1.0.0
  feature_revision: ntp-features/1.0.0
  geometry_topology_revision: synthetic-semantic-anchors/1.0.0
